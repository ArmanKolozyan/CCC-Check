[package]
name = "acir_field"
description = "The field implementation being used by ACIR."
version = "1.0.0-beta.6"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
hex = "0.4.2"
num-bigint = "0.4"
serde = { version = "1.0.136", features = ["derive"] }

ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-bls12-381 = { version = "0.5.0", default-features = false, features = ["curve"], optional = true }
ark-ff = { version = "0.5.0", default-features = false }
ark-std = { version = "0.5.0", default-features = false }

cfg-if = "1.0"

[features]
bn254 = []
bls12_381 = ["dep:ark-bls12-381"]
